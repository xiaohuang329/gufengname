<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>古风名生成器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 20px; font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    background: #f5f0e4; color: #3a3226; display: flex; justify-content: center; }
  .wrap { max-width: 980px; width: 100%; }
  h1 { font-size: 24px; font-weight: 500; letter-spacing: 12px; color: #6b5b3e;
    text-align: center; padding-bottom: 18px; border-bottom: 1px solid #ddd2ba; margin: 0 0 14px; }
  .meta { text-align: center; color: #a89878; font-size: 13px; letter-spacing: 1px; margin-bottom: 8px; }
  .load-status { text-align: center; font-size: 12px; color: #8a7550; margin-bottom: 18px; min-height: 18px; }
  .tabs { display: flex; gap: 0; margin-bottom: 22px; justify-content: center; border-bottom: 1px solid #ddd2ba; }
  .tab-btn { padding: 12px 32px; border: 0; background: none; font-family: inherit;

  .modes { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .mode-btn { padding: 10px 22px; border: 1px solid #c9bda3; background: #fffdf7; color: #3a3226;
    font-family: inherit; font-size: 14px; cursor: pointer; letter-spacing: 3px; border-radius: 3px; }
  .mode-btn.active { background: #6b5b3e; color: #f5f0e4; border-color: #6b5b3e; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  label { font-size: 14px; color: #6b5b3e; letter-spacing: 1px; }

  input[type=text] { flex: 1; min-width: 200px; }
  button.primary { background: #6b5b3e; color: #f5f0e4; border-color: #6b5b3e; cursor: pointer; padding: 9px 22px; }

  button.accent:hover { background: #6e5630; }
  button.danger { background: #8a4b3b; color: #fffdf7; border-color: #8a4b3b; cursor: pointer; padding: 9px 22px; }
  button.danger:hover { background: #6e3a2e; }
  button.small { padding: 4px 10px; font-size: 12px; letter-spacing: 1px; }
  button.scope-btn { background: #faf5ea; border-color: #d4c5a0; color: #6b5b3e;
    padding: 8px 14px; cursor: pointer; letter-spacing: 1px; }
  button.scope-btn:hover { background: #f4ecd9; }
  .scope-panel { background: #faf5ea; border: 1px solid #e2d9c5; border-radius: 6px;
    padding: 14px 16px; margin-bottom: 12px; max-height: 400px; overflow-y: auto; }
  .scope-actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .scope-actions button { padding: 5px 12px; font-size: 12px; letter-spacing: 1px;
    background: #fffdf7; border: 1px solid #c9bda3; cursor: pointer; border-radius: 3px; color: #6b5b3e; }
  .scope-actions button:hover { background: #f4ecd9; }
  .scope-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 12px; }

  .scope-item:hover { background: #f4ecd9; }
  .scope-item input[type=checkbox] { margin: 0; cursor: pointer; accent-color: #8a6d3b; }

  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .name-card { background: #fffdf7; border: 1px solid #e2d9c5; border-radius: 6px;
    padding: 16px 18px 12px; position: relative; transition: background .15s; }
  .name-card:hover { background: #f9f4e6; }
  .name-text { font-size: 28px; letter-spacing: 8px; color: #4a3f2c; margin-bottom: 10px;
    cursor: pointer; user-select: none; padding-right: 34px; }
  .name-text:hover { color: #6b5b3e; }
  .name-source { font-size: 12px; color: #a89878; line-height: 1.8; }
  .name-source b { color: #8a7550; font-weight: normal; }
  .name-source .quote { color: #6b5b3e; display: block; margin-top: 3px; }
  mark {
    background: #f4e5a8;
    color: #7a5f2e;
    font-weight: 600;
    padding: 0 3px;
    border-radius: 3px;
  }
  .star-btn { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0;
    border: 0; background: none; cursor: pointer; font-size: 20px; color: #d4c5a0;
    display: flex; align-items: center; justify-content: center; }
  .star-btn:hover { color: #c9a961; transform: scale(1.15); }
  .star-btn.on { color: #d4a017; }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .refresh-btn, .undo-btn, .del-src-btn {
    display: inline-block; padding: 3px 10px;
    background: none; border: 0;
    font-family: inherit; font-size: 11px; letter-spacing: 1px;
    cursor: pointer; border-radius: 3px;
  }
  .refresh-btn { color: #a89878; }
  .refresh-btn:hover { color: #8a6d3b; background: #f4ecd9; }
  .undo-btn { color: #a89878; }
  .undo-btn:hover:not(:disabled) { color: #8a6d3b; background: #f4ecd9; }
  .undo-btn:disabled { color: #d8cfc0; cursor: not-allowed; }
  .del-src-btn { color: #c4b89a; }

  .empty { text-align: center; color: #b8a988; padding: 40px; font-size: 14px; line-height: 2; }
  .hidden { display: none; }

    background: #6b5b3e; color: #f5f0e4; padding: 10px 24px; border-radius: 4px;
    font-size: 14px; letter-spacing: 2px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9999; }
  .toast.show { opacity: 1; }
  .corpus-summary { text-align: center; font-size: 14px; color: #6b5b3e; letter-spacing: 2px;

  .corpus-summary b { color: #8a6d3b; font-weight: 500; font-size: 18px; margin: 0 4px; }

  .corpus-search input { flex: 1; }
  .corpus-item { border-bottom: 1px solid #e2d9c5; }

  .corpus-item-header:hover { background: #f9f4e6; }

    transition: transform .2s; display: inline-block; }
  .corpus-item.open .arrow { transform: rotate(90deg); }
  .corpus-item-body { display: none; padding: 0 6px 14px; }
  .corpus-item.open .corpus-item-body { display: block; }

    cursor: pointer; border-radius: 3px; line-height: 1.7; }
  .corpus-poem:hover { background: #f4ecd9; }
  .corpus-poem-title { color: #4a3f2c; }
  .corpus-count { color: #a89878; font-size: 13px; }
  .corpus-empty { text-align: center; color: #b8a988; padding: 30px; font-size: 13px; }
  .corpus-match-item { padding: 12px 6px; border-bottom: 1px solid #e2d9c5; cursor: pointer;

  .corpus-match-item:hover { background: #f9f4e6; }

  .fold-header:hover { color: #6b5b3e; }
  .fold-body { display: none; margin-top: 12px; font-size: 12px; color: #a89878; line-height: 2;

    border-radius: 4px; padding: 12px 14px; }
  .fold.open .fold-body { display: block; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .filter-row input { flex: 1; min-width: 0; max-width: 120px; }
  .filter-label { font-size: 12px; color: #8a7550; margin-bottom: 6px; letter-spacing: 1px; }
  .tag-list { margin-bottom: 14px; min-height: 24px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: #efe4c9; color: #6b5b3e;
    padding: 3px 4px 3px 10px; border-radius: 999px; font-size: 13px; margin: 0 6px 6px 0; }
  .tag .tag-x { cursor: pointer; color: #a89878; font-size: 14px; width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
  .tag .tag-x:hover { background: #d4c5a0; color: #6b5b3e; }
  .freq-status { font-size: 12px; color: #8a7550; margin-left: 10px; }
  .modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(58, 50, 38, 0.5); display: flex; align-items: center; justify-content: center;
    z-index: 9998; padding: 20px; }
  .modal { background: #fffdf7; border-radius: 8px; max-width: 600px; width: 100%;
    max-height: 80vh; overflow-y: auto; padding: 28px 32px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal h3 { margin: 0 0 4px; font-size: 18px; color: #4a3f2c; letter-spacing: 2px; font-weight: 500; }
  .modal .modal-meta { font-size: 12px; color: #a89878; margin-bottom: 16px; letter-spacing: 1px; }
  .modal .modal-body { font-size: 15px; line-height: 2; color: #3a3226;
    letter-spacing: 1px; white-space: pre-wrap; word-break: break-all; }
  .modal-close { margin-top: 20px; text-align: right; }
  .slider-box { background: #faf5ea; border: 1px solid #e2d9c5;
    border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; }
  .slider-label { display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: #6b5b3e; margin-bottom: 10px; letter-spacing: 1px; }
  .slider-label b { color: #8a6d3b; font-size: 18px; font-weight: 500;
    margin: 0 4px; min-width: 28px; display: inline-block; text-align: center; }
  .slider-hint { font-size: 11px; color: #a89878; margin-top: 8px; line-height: 1.8; }
  input[type=range] { width: 100%; height: 4px; -webkit-appearance: none;
    background: #e2d9c5; border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
    background: #8a6d3b; border-radius: 50%; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; background: #8a6d3b;
    border-radius: 50%; cursor: pointer; border: 0; }
  .candidate-count { display: inline-block; background: #efe4c9; color: #6b5b3e;
    padding: 2px 10px; border-radius: 999px; font-size: 12px; }
</style>

<body>
<div class="wrap">
  <h1>典籍取名</h1>
  <div class="meta" id="meta">正在加载 data.js…</div>
  <div class="load-status" id="loadStatus"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="gen" onclick="switchTab('gen', this)">取名</button>
    <button class="tab-btn" data-tab="fav" onclick="switchTab('fav', this)">
      收藏夹<span class="badge" id="favBadge">0</span>
    </button>
    <button class="tab-btn" data-tab="corpus" onclick="switchTab('corpus', this)">语料库</button>
  </div>

  <div id="view-gen">
    <div class="modes">
      <button class="mode-btn active" data-mode="same" onclick="setMode('same', this)">同句抽字</button>
      <button class="mode-btn" data-mode="cross" onclick="setMode('cross', this)">跨篇组合</button>
      <button class="mode-btn" data-mode="reverse" onclick="setMode('reverse', this)">反向匹配典故</button>
    </div>

    <div class="panel">
      <div class="row" id="row-len">
        <label>名字长度</label>
        <select id="nameLen">
          <option value="1">单字名</option>
          <option value="2" selected>双字名</option>
        </select>
        <label>姓氏</label>
        <select id="surnameType">
          <option value="single" selected>单字姓</option>
        </select>
        <label>数量</label>
        <select id="count">
          <option>8</option>
          <option selected>12</option>
          <option>24</option>
        </select>
        <button class="scope-btn" id="scopeBtn" onclick="toggleScope()">范围：全部 ▾</button>
      </div>
      <div class="row" id="row-refresh">
        <label>换字模式</label>
        <select id="refreshMode">
          <option value="none" selected>不锁定（姓和名都换）</option>
          <option value="surname">锁定姓氏（只换名）</option>
          <option value="given">锁定名字（只换姓）</option>
        </select>
        <span style="font-size:12px;color:#a89878;letter-spacing:0;">
          点卡片上「↻ 换字」时生效
        </span>
      </div>
      <div class="row hidden" id="row-reverse">
        <label>输入名字</label>
        <input type="text" id="reverseInput" placeholder="例如：张伟、李清澜、楚墨白" onkeydown="if(event.key==='Enter')doGenerate()">
      </div>
      <div id="scope-panel" class="scope-panel hidden">
        <div class="scope-actions">
          <button onclick="selectAllWorks()">全选</button>
          <button onclick="clearAllWorks()">全不选</button>
          <button onclick="resetScope()">重置为全部</button>
          <span style="font-size:12px;color:#a89878;margin-left:auto;align-self:center;">
            只从勾选的分类里抽字
          </span>
        </div>
        <div id="scopeList" class="scope-list"></div>
      </div>
      <button class="primary" id="genBtn" onclick="doGenerate()" disabled>生成</button>
    </div>

    <div class="results" id="results"></div>
    <div class="output-info" id="info"></div>
  </div>

  <div id="view-fav" class="hidden">
    <div class="panel">
      <div class="row" style="justify-content:space-between;">
        <span style="font-size:14px;color:#6b5b3e;letter-spacing:2px;" id="favCount">共 0 个收藏</span>
        <span><button class="danger" onclick="clearFav()">清空收藏</button></span>
      </div>
    </div>
    <div class="results" id="favResults"></div>
  </div>

  <div id="view-corpus" class="hidden">
    <div class="panel">
      <div class="corpus-summary" id="corpusSummary">
        总 <b id="sumWorks">0</b> 部 · <b id="sumPoems">0</b> 篇 · 可用诗 <b id="sumSents">0</b> 篇 · 排除字 <b id="sumExclude">0</b> 个 · 姓氏 <b id="sumSurnames">0</b> 个 · 已删源 <b id="sumDeleted">0</b> 处
      </div>

      <div class="slider-box">
        <div class="slider-label">
          <span>二级字出现次数下限（越小范围越宽）</span>
          <span>当前：<b id="sliderValue">3</b>次</span>
        </div>
        <input type="range" id="rangeSlider" min="1" max="30" value="3" step="1"
               oninput="onSliderChange(this.value)">
        <div class="slider-hint">
          一级字（最常用 3755 字）全部保留。<br>
          二级字（次常用 3008 字）需在语料中出现 ≥ 此数值才能参与抽字。<br>
          当前可用字：<span class="candidate-count" id="candidateCount">0 字</span>
        </div>
      </div>

      <div class="corpus-search">
        <input type="text" id="corpusSearchInput" placeholder="输入一个字，查哪些分类包含它" oninput="doCorpusSearch()">
        <button class="primary" onclick="doCorpusSearch()">查</button>
      </div>
      <div id="corpusSearchResult"></div>
      <div id="corpusCatalog"></div>
      <div class="fold" id="foldExclude">
        <div class="fold-header" onclick="toggleFold('foldExclude')">▸ 查看被过滤的字</div>
        <div class="fold-body" id="excludeBody"></div>
      </div>
      <div class="fold" id="foldCustom">
        <div class="fold-header" onclick="toggleFold('foldCustom')">▸ 自定义过滤字</div>
        <div class="fold-body">
          <div class="filter-label">添加自定义过滤字（不参与抽字）</div>
          <div class="filter-row">
            <input type="text" id="customExcludeInput" maxlength="1" placeholder="一个字">
            <button class="accent small" onclick="addCustomExclude()">添加过滤</button>
          </div>
          <div class="tag-list" id="customExcludeTags"></div>
          <div class="filter-label">取消内置过滤字（放回抽字池）</div>
          <div class="filter-row">
            <input type="text" id="whitelistInput" maxlength="1" placeholder="一个字">
            <button class="accent small" onclick="addWhitelist()">取消过滤</button>
          </div>
          <div class="tag-list" id="whitelistTags"></div>
          <div style="margin-top:14px; padding-top:12px; border-top:1px dashed #e2d9c5;">
            <button class="primary small" onclick="refreshAll()">重建索引</button>
            <span class="freq-status" id="freqStatus">就绪</span>
          </div>
          <div style="margin-top:14px; padding-top:12px; border-top:1px dashed #e2d9c5;">
            <button class="danger small" onclick="clearBlacklist()">清空删源记录</button>
            <span class="freq-status">已删 <span id="blacklistCount">0</span> 处</span>
          </div>
          <div style="margin-top:14px; padding-top:12px; border-top:1px dashed #e2d9c5;">
            <button class="danger small" onclick="clearIndexCache()">清空索引缓存</button>
            <span class="freq-status" id="cacheStatus">检查中…</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/t2cn.js"></script>
<script src="data.js"></script>
<script src="weijin.js"></script>
<script src="guwen.js"></script>
<script>
let CORPUS = Object.assign({}, window.CORPUS_DATA || {});
if (window.WEIJIN_DATA) {
  for (const [k, v] of Object.entries(window.WEIJIN_DATA)) CORPUS[k] = v;
}
if (window.SANWEN_DATA) {
  for (const [k, v] of Object.entries(window.SANWEN_DATA)) CORPUS[k] = v;
}

let _t2cn = null;
function initOpenCC() {
  try {
    const O = window.OpenCC || window.opencc;
    if (O && O.Converter) {
      _t2cn = O.Converter({ from: 'tw', to: 'cn' });
      console.log('[OpenCC] 初始化成功');
      return true;
    }
    return false;
  } catch (e) { return false; }
}
function toSimplified(str) {
  if (!str) return str;
  if (_t2cn) return _t2cn(str);
  return str;
}

/* ============================================================
   IndexedDB 缓存
   ============================================================ */
const IDB_NAME = 'gufeng_db_v1';
const IDB_STORE = 'cache';
const CACHE_KEY_INDEX = 'index_v4';

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).put(value, key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) { }
}
async function idbClearAll() {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) { }
}

function computeIndexHash() {
  const excludeArr = [...getExcludedSet()].sort().join('');
  let h1 = 0;
  for (let i = 0; i < excludeArr.length; i++) h1 = ((h1 << 5) - h1 + excludeArr.charCodeAt(i)) | 0;
  const works = getDrawableKeys();
  const countStr = works.map(k => k + ':' + CORPUS[k].length).join('|');
  let h2 = 0;
  for (let i = 0; i < countStr.length; i++) h2 = ((h2 << 5) - h2 + countStr.charCodeAt(i)) | 0;
  return `v5_${h1}_${h2}`;
}

/* ============================================================

function buildLevelChars(zoneStart, zoneEnd) {
  const bytes = [];
  for (let q = zoneStart; q <= zoneEnd; q++) {
    for (let w = 1; w <= 94; w++) bytes.push(q + 160, w + 160);
  }
  try {
    const text = new TextDecoder('gbk').decode(new Uint8Array(bytes));
    return new Set([...text].filter(c => /[\u4e00-\u9fa5]/.test(c)));
  } catch (e) { return null; }
}

function computeCandidates() {
  CANDIDATE_CHARS = new Set();
  for (const [c, freq] of Object.entries(CHAR_FREQ)) {
    if (isExcluded(c)) continue;
    if (isLevel1(c)) { CANDIDATE_CHARS.add(c); continue; }
    if (isLevel2(c) && freq >= SLIDER_VALUE) CANDIDATE_CHARS.add(c);
  }
  const el = document.getElementById('candidateCount');
  if (el) el.textContent = `${CANDIDATE_CHARS.size} 字`;
}

function isUsableChar(c) { return CANDIDATE_CHARS.has(c); }

function applyBlacklistToPoems() {
  for (const entry of POEMS) {
    if (BLACKLIST[entry.id]) {
      entry.groups = entry.groups.filter(g => !BLACKLIST[entry.id].includes(g));
    }
  }
  POEMS = POEMS.filter(e => e.groups.length >= 1);
  rebuildPoemsByWork();
}

function rebuildPoemsByWork() {
  POEMS_BY_WORK = {};
  for (const p of POEMS) {
    if (!POEMS_BY_WORK[p.workName]) POEMS_BY_WORK[p.workName] = [];
    POEMS_BY_WORK[p.workName].push(p);

/* ============================================================
   建索引
   ============================================================ */
async function buildIndex(forceRebuild) {
  if (BUILDING) return;
  BUILDING = true;
  INDEX_READY = false;
  const genBtn = document.getElementById('genBtn');
  if (genBtn) genBtn.disabled = true;

  const statusEl = document.getElementById('freqStatus');
  const loadEl = document.getElementById('loadStatus');
  const cacheEl = document.getElementById('cacheStatus');
  const t0 = Date.now();

  const currentHash = computeIndexHash();

  if (!forceRebuild) {
    loadEl.textContent = '检查缓存…';
    const cached = await idbGet(CACHE_KEY_INDEX);
    if (cached && cached.hash === currentHash && cached.poems && cached.freq) {
      POEMS = cached.poems;
      CHAR_FREQ = cached.freq;
      applyBlacklistToPoems();
      computeCandidates();
      INDEX_READY = true;
      BUILDING = false;
      const elapsed = ((Date.now() - t0) / 1000).toFixed(2);
      loadEl.textContent = `从缓存加载完成（${elapsed}s）· ${POEMS.length} 篇 · ${CANDIDATE_CHARS.size} 候选字`;
      if (statusEl) statusEl.textContent = `缓存命中（${elapsed}s）`;
      if (cacheEl) cacheEl.textContent = `已缓存 · ${new Date(cached.time).toLocaleString()}`;
      if (genBtn) genBtn.disabled = false;
      updateBlacklistCount();
      renderScopeList();
      doGenerate();
      return;
    }
  }

  CHAR_FREQ = {};
  POEMS = [];

  const drawableKeys = getDrawableKeys();
  const total = drawableKeys.length;
  let workIdx = 0;

  for (const workName of drawableKeys) {
    const poems = CORPUS[workName];
    for (const poem of poems) {
      const simplified = toSimplified(poem.text);
      const rawGroups = simplified.split(/[。！？\n]/);
      const groups = [];
      for (const g of rawGroups) {
        const t = g.trim();
        if (t.length < 4) continue;
        let count = 0;
        const seen = new Set();
        for (const c of t) {
          if (!/[\u4e00-\u9fa5]/.test(c)) continue;
          if (isExcluded(c)) continue;
          if (!isLevel1(c) && !isLevel2(c)) continue;
          CHAR_FREQ[c] = (CHAR_FREQ[c] || 0) + 1;
          if (!seen.has(c)) { seen.add(c); count++; }
        }
        if (count < 2) continue;
        groups.push(t);
      }
      if (!groups.length) continue;

      const entryId = workName + '||' + (poem.title || '无题') + '||' + groups[0];
      POEMS.push({ id: entryId, groups, workName, poemTitle: poem.title });
    }

    workIdx++;
    if (workIdx % 2 === 0) {
      const pct = Math.round(workIdx / total * 100);
      if (loadEl) loadEl.textContent = `建立索引中… ${pct}%`;
      await new Promise(r => setTimeout(r, 0));
    }
  }

  try {
    await idbSet(CACHE_KEY_INDEX, {
      hash: currentHash, poems: POEMS, freq: CHAR_FREQ, time: Date.now()
    });
    if (cacheEl) cacheEl.textContent = `已缓存 · ${new Date().toLocaleString()}`;
  } catch (e) { }

  applyBlacklistToPoems();
  computeCandidates();

  INDEX_READY = true;
  BUILDING = false;
  const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
  if (statusEl) statusEl.textContent = `已就绪（${elapsed}s）`;
  if (loadEl) loadEl.textContent = `索引完成 · ${POEMS.length} 篇可用 · ${CANDIDATE_CHARS.size} 候选字`;

  if (genBtn) genBtn.disabled = false;
  updateBlacklistCount();
  renderScopeList();
  doGenerate();
}

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function extractChars(text) {

}
function countAllPoems() { return Object.values(CORPUS).reduce((a, b) => a + b.length, 0); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}
function copyName(name) {
  navigator.clipboard?.writeText(name).then(() => showToast('已复制：' + name)).catch(() => {});
}
function findLine(text, chars) {
  const lines = text.split(/[。！？；\n]/).map(s => s.trim()).filter(Boolean);
  for (const line of lines) if (chars.every(c => line.includes(c))) return line + '。';
  for (const line of lines) if (chars.some(c => line.includes(c))) return line + '。';
  return text.slice(0, 30) + '…';
}
function getDrawableKeys() {
  return Object.keys(CORPUS).filter(k => {
    if (k.startsWith('四书五经·')) return k.includes('易') || k.includes('孟');
    return CORPUS[k] && CORPUS[k].length;
  });
}
function getMatchableKeys() {
  return Object.keys(CORPUS).filter(k => CORPUS[k] && CORPUS[k].length);
}

/* ============================================================
   高亮
   ============================================================ */
function renderQuote(text, chars) {
  if (!chars) return escapeHtml(text);
  const need = {};
  for (const c of chars) need[c] = (need[c] || 0) + 1;
  let out = '';
  for (const c of text) {
    const safe = escapeHtml(c);
    if (need[c] > 0) {
      out += `<mark>${safe}</mark>`;
      need[c]--;
    } else {
      out += safe;
    }
  }
  return out;
}

/* ============================================================
   抽字
   ============================================================ */
function pickRandomPoem(activeWorks) {
  if (!activeWorks.length) return null;
  for (let i = 0; i < 30; i++) {
    const w = activeWorks[Math.floor(Math.random() * activeWorks.length)];
    const list = POEMS_BY_WORK[w];
    if (list && list.length) return list[Math.floor(Math.random() * list.length)];
  }
  return null;
}

function pickTwoFromRange(rangeGroups, excludeChars) {
  const rangeText = rangeGroups.join('，');
  const positions = [];
  for (let i = 0; i < rangeText.length; i++) {
    if (isUsableChar(rangeText[i])) positions.push(i);
  }
  if (positions.length < 2) return null;
  for (let tries = 0; tries < 40; tries++) {
    const i1 = Math.floor(Math.random() * positions.length);
    const i2 = Math.floor(Math.random() * positions.length);
    if (i1 === i2) continue;
    const c1 = rangeText[positions[i1]];
    const c2 = rangeText[positions[i2]];
    if (c1 === c2) continue;
    const ordered = Math.random() < 0.5 ? c1 + c2 : c2 + c1;
    if (excludeChars && ordered === excludeChars) continue;
    return { chars: ordered, quote: rangeGroups.join('。') + '。' };
  }
  return null;
}

function pickTwoFromPoem(poem) {
  const groups = poem.groups;
  const n = groups.length;
  if (!n) return null;
  const center = Math.floor(Math.random() * n);
  let start = center, end = center;
  const r = Math.random();
  if (r >= 0.7) {
    if (center > 0) start = center - 1;
    if (center < n - 1) end = center + 1;
  } else if (r >= 0.4) {
    if (center === 0 && n > 1) end = 1;
    else if (center === n - 1 && n > 1) start = n - 2;
    else if (Math.random() < 0.5) start = center - 1;
    else end = center + 1;
  }
  const rangeGroups = groups.slice(start, end + 1);
  const result = pickTwoFromRange(rangeGroups);
  if (!result) return null;
  return { chars: result.chars, quote: result.quote, rangeGroups };
}

function pickOneFromPoem(poem, surname, excludeChar) {
  const fullText = poem.groups.join('，');
  const found = new Set();
  for (let i = 0; i < fullText.length - 1; i++) {
    if (fullText[i] !== surname) continue;
    for (let j = i + 1; j < fullText.length; j++) {
      const c = fullText[j];
      if (isUsableChar(c)) {
        if (!excludeChar || c !== excludeChar) found.add(c);
        break;
      }
    }
  }
  if (!found.size) return null;
  const arr = [...found];
  const c = arr[Math.floor(Math.random() * arr.length)];
  return { char: c, quote: fullText, groups: poem.groups };
}

/* ============================================================

   ============================================================ */
function deleteSourceByRid(rid, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const targets = RESULT_STORE[rid];
  if (!targets || !targets.length) return;
  const summary = targets.map(t => t.groups.join('，')).join(' / ');
  if (!confirm(`确定删源？\n\n将删除以下语料：\n${summary}\n\n（以后不会再从这些句子抽字）`)) return;

  for (const t of targets) {
    if (!BLACKLIST[t.entryId]) BLACKLIST[t.entryId] = [];
    for (const g of t.groups) {
      if (!BLACKLIST[t.entryId].includes(g)) BLACKLIST[t.entryId].push(g);
    }
    const entry = POEMS.find(p => p.id === t.entryId);
    if (entry) entry.groups = entry.groups.filter(g => !BLACKLIST[t.entryId].includes(g));
  }
  POEMS = POEMS.filter(e => e.groups.length >= 1);
  rebuildPoemsByWork();
  saveBlacklist();
  updateBlacklistCount();
  delete RESULT_STORE[rid];
  delete REFRESH_INFO[rid];
  const card = document.getElementById('card-' + rid);
  if (card) card.remove();
  showToast('已删源');
}

function clearBlacklist() {
  if (!blacklistCount()) { showToast('没有删源记录'); return; }
  if (!confirm('确定清空所有删源记录？被删的句子会重新进入抽字池。')) return;
  BLACKLIST = {};
  saveBlacklist();
  updateBlacklistCount();
  showToast('已清空，正在重建索引…');
  buildIndex(true);

/* ============================================================
   生成
   ============================================================ */
function genSame() {
  if (!INDEX_READY || !POEMS.length || !SINGLE_SURNAMES.length) return null;
  const active = getActiveDrawableKeys();
  if (!active.length) return null;
  const surname = rand(SINGLE_SURNAMES);
  for (let attempt = 0; attempt < 30; attempt++) {
    const poem = pickRandomPoem(active);
    if (!poem) continue;
    const result = pickTwoFromPoem(poem);
    if (!result) continue;
    const rid = makeRid();
    RESULT_STORE[rid] = [{ entryId: poem.id, groups: result.rangeGroups }];
    REFRESH_INFO[rid] = {
      mode: 'same',
      poemId: poem.id,
      rangeGroups: result.rangeGroups,
      surname: surname,
      chars: result.chars,
      history: []
    };
    return {
      rid,
      name: surname + result.chars,
      sources: [{
        chars: result.chars,
        from: `《${poem.workName}》· ${poem.poemTitle}`,
        quote: result.quote
      }]
    };
  }
  return null;
}

function genSameSingle() {
  if (!INDEX_READY || !POEMS.length || !SINGLE_SURNAMES.length) return null;
  const active = getActiveDrawableKeys();
  if (!active.length) return null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const surname = rand(SINGLE_SURNAMES);
    const poem = pickRandomPoem(active);
    if (!poem) continue;
    const result = pickOneFromPoem(poem, surname);
    if (!result) continue;
    const rid = makeRid();
    RESULT_STORE[rid] = [{ entryId: poem.id, groups: [result.quote] }];
    REFRESH_INFO[rid] = {
      mode: 'single',
      poemId: poem.id,
      surname: surname,
      chars: result.char,
      history: []
    };
    return {
      rid,
      name: surname + result.char,
      sources: [{
        chars: surname + result.char,
        from: `《${poem.workName}》· ${poem.poemTitle}`,
        quote: result.quote + '。'
      }]
    };
  }
  return null;
}

function genCross() {
  if (!INDEX_READY || !POEMS.length || !SINGLE_SURNAMES.length) return null;
  const active = getActiveDrawableKeys();
  if (!active.length) return null;
  const surname = rand(SINGLE_SURNAMES);
  for (let attempt = 0; attempt < 20; attempt++) {
    const p1 = pickRandomPoem(active);
    const p2 = pickRandomPoem(active);
    if (!p1 || !p2 || p1 === p2) continue;
    const r1 = pickTwoFromPoem(p1);
    if (!r1) continue;
    const c1 = r1.chars[Math.floor(Math.random() * 2)];
    const groupIdx = Math.floor(Math.random() * p2.groups.length);
    const groupText = p2.groups[groupIdx];
    const positions = [];
    for (let i = 0; i < groupText.length; i++) {
      if (isUsableChar(groupText[i])) positions.push(i);
    }
    if (!positions.length) continue;
    const c2 = groupText[positions[Math.floor(Math.random() * positions.length)]];
    if (c1 === c2) continue;
    const rid = makeRid();
    RESULT_STORE[rid] = [
      { entryId: p1.id, groups: r1.rangeGroups },
      { entryId: p2.id, groups: [groupText] }
    ];
    // 跨篇组合暂不支持刷新
    return {
      rid,
      name: surname + c1 + c2,
      sources: [
        { char: c1, from: `《${p1.workName}》· ${p1.poemTitle}`, quote: r1.quote },
        { char: c2, from: `《${p2.workName}》· ${p2.poemTitle}`, quote: groupText + '。' }
      ]
    };
  }
  return null;
}

function reverseMatch(input) {
  const chars = extractChars(input);
  if (!chars.length) return [];
  const matches = [];
  for (const workName of getMatchableKeys()) {
    for (const poem of CORPUS[workName]) {
      const simp = toSimplified(poem.text);
      const hit = chars.filter(c => simp.includes(c));
      if (hit.length > 0) {
        matches.push({
          score: hit.length, workName, title: poem.title,
          hits: hit, quote: findLine(simp, hit)
        });
      }
    }
  }
  matches.sort((a, b) => b.score - a.score);
  return matches.slice(0, 30);
}

   卡片渲染 & 刷新 & 返回

function buildCardHTML(rid, name, sources, info) {
  const faved = isFaved(name);
  const srcJson = escapeAttr(JSON.stringify(sources));
  const showRefresh = info && (info.mode === 'same' || info.mode === 'single');
  const canUndo = info && info.history && info.history.length > 0;
  return `
    <button class="star-btn ${faved ? 'on' : ''}" data-name="${escapeAttr(name)}"
            onclick="toggleFav('${escapeAttr(name)}', ${srcJson}, event)">${faved ? '★' : '☆'}</button>
    <div class="name-text" onclick="copyName('${escapeAttr(name)}')">${escapeHtml(name)}</div>
    <div class="name-source">
      ${sources.map(s => `
        <b>${escapeHtml(s.chars || s.char)}</b> · ${escapeHtml(s.from)}
        <span class="quote">「${renderQuote(s.quote, s.chars || s.char)}」</span>
      `).join('')}
    </div>
    <div class="card-actions">
      ${showRefresh ? `<button class="refresh-btn" onclick="refreshCard('${rid}', event)">↻ 换字</button>` : ''}
      ${showRefresh ? `<button class="undo-btn" ${canUndo ? '' : 'disabled'} onclick="undoCard('${rid}', event)">↶ 返回</button>` : ''}
      <button class="del-src-btn" onclick="deleteSourceByRid('${rid}', event)">× 删源</button>
    </div>
  `;
}

function renderCard(rid, name, sources, info) {
  const card = document.getElementById('card-' + rid);
  if (!card) return;
  card.innerHTML = buildCardHTML(rid, name, sources, info);
}

function refreshCard(rid, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const info = REFRESH_INFO[rid];
  if (!info) { showToast('此卡片不支持换字'); return; }

  const mode = document.getElementById('refreshMode').value;

  // 快照当前状态
  const snapshot = {
    name: info.surname + info.chars,
    surname: info.surname,
    chars: info.chars,
    sources: JSON.parse(JSON.stringify(RESULT_STORE[rid] || []))
  };

  if (info.mode === 'same') {
    const poem = POEMS.find(p => p.id === info.poemId);
    if (!poem) { showToast('源诗已失效'); return; }

    let newSurname = info.surname;
    let newChars = info.chars;
    let newQuote = null;

    if (mode !== 'surname') newSurname = rand(SINGLE_SURNAMES);

    if (mode === 'given') {
      // 锁名：保留原字，只换姓
      newChars = info.chars;
      // 从 RESULT_STORE 里拿原 quote
      if (RESULT_STORE[rid] && RESULT_STORE[rid][0] && RESULT_STORE[rid][0].quote) {
        newQuote = RESULT_STORE[rid][0].quote;
      } else {
        newQuote = info.rangeGroups.join('。') + '。';
      }
    } else {
      // 不锁 或 锁姓：重抽字
      const result = pickTwoFromRange(info.rangeGroups, mode === 'surname' ? info.chars : null);
      if (!result) { showToast('这句里抽不出新字'); return; }
      newChars = result.chars;
      newQuote = result.quote;
    }

    const sources = [{
      chars: newChars,
      from: `《${poem.workName}》· ${poem.poemTitle}`,
      quote: newQuote
    }];

    if (!info.history) info.history = [];
    if (info.history.length >= 20) info.history.shift();
    info.history.push(snapshot);

    RESULT_STORE[rid] = [{ entryId: poem.id, groups: info.rangeGroups }];
    info.surname = newSurname;
    info.chars = newChars;
    renderCard(rid, newSurname + newChars, sources, info);
    return;
  }

  if (info.mode === 'single') {
    const poem = POEMS.find(p => p.id === info.poemId);
    if (!poem) { showToast('源诗已失效'); return; }

    let newSurname = info.surname;
    if (mode !== 'surname') newSurname = rand(SINGLE_SURNAMES);

    // 单字名：锁名退化为不锁（因为字与姓强绑定）
    const exclude = (mode === 'surname' && newSurname === info.surname) ? info.chars : null;
    const result = pickOneFromPoem(poem, newSurname, exclude);
    if (!result) {
      if (mode === 'surname') { showToast('这句里没有其他可用字'); return; }
      showToast('这个姓在这句里抽不出字'); return;
    }

    const sources = [{
      chars: newSurname + result.char,
      from: `《${poem.workName}》· ${poem.poemTitle}`,
      quote: result.quote + '。'
    }];

    if (!info.history) info.history = [];
    if (info.history.length >= 20) info.history.shift();
    info.history.push(snapshot);

    RESULT_STORE[rid] = [{ entryId: poem.id, groups: [result.quote] }];
    info.surname = newSurname;
    info.chars = result.char;
    renderCard(rid, newSurname + result.char, sources, info);
    return;
  }
}

function undoCard(rid, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const info = REFRESH_INFO[rid];
  if (!info || !info.history || !info.history.length) return;
  const prev = info.history.pop();
  info.surname = prev.surname;
  info.chars = prev.chars;
  RESULT_STORE[rid] = prev.sources;
  renderCard(rid, prev.name, prev.sources, info);
}

/* ============================================================
   渲染主流程
   ============================================================ */
function setMode(mode, btn) {
  MODE = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('row-len').classList.toggle('hidden', mode === 'reverse');
  document.getElementById('row-refresh').classList.toggle('hidden', mode === 'reverse');
  document.getElementById('row-reverse').classList.toggle('hidden', mode !== 'reverse');
  document.getElementById('scope-panel').classList.add('hidden');
  document.getElementById('results').innerHTML = '';
  document.getElementById('info').textContent = '';
}

document.getElementById('refreshMode').addEventListener('change', function() {
  localStorage.setItem(LS_REFRESH_MODE, this.value);
});

function doGenerate() {
  if (!INDEX_READY) {
    document.getElementById('results').innerHTML = '<div class="empty">索引构建中，请稍候…</div>';
    return;
  }
  const results = document.getElementById('results');
  const info = document.getElementById('info');
  results.innerHTML = ''; info.textContent = '';

  if (MODE === 'reverse') {
    const input = document.getElementById('reverseInput').value.trim();
    if (!input) { results.innerHTML = '<div class="empty">请先输入一个名字</div>'; return; }
    const matches = reverseMatch(input);
    if (!matches.length) {
      results.innerHTML = `<div class="empty">没找到与「${escapeHtml(input)}」相关的句子。</div>`;
      return;
    }
    results.innerHTML = matches.map(m => {
      const faved = isFaved(input);
      const srcJson = escapeAttr(JSON.stringify([{ chars: m.hits.join(''), from: '《' + m.workName + '》· ' + m.title, quote: m.quote }]));
      return `
        <div class="name-card">
          <button class="star-btn ${faved ? 'on' : ''}" data-name="${escapeAttr(input)}"
                  onclick="toggleFav('${escapeAttr(input)}', ${srcJson}, event)">${faved ? '★' : '☆'}</button>
          <div class="name-text" onclick="copyName('${escapeAttr(input)}')">${escapeHtml(input)}</div>
          <div class="name-source">
            <b>匹配字：</b>${m.hits.map(c => escapeHtml(c)).join('、')}<br>
            <b>出处：</b>《${escapeHtml(m.workName)}》· ${escapeHtml(m.title)}<br>
            <span class="quote">「${renderQuote(m.quote, m.hits)}」</span>
          </div>
        </div>
      `;
    }).join('');
    info.textContent = `共匹配到 ${matches.length} 条典故（显示前 30 条）`;
    return;
  }

  const nameLen = document.getElementById('nameLen').value;
  const count = parseInt(document.getElementById('count').value);
  const seen = new Set();
  const out = [];
  let guard = 0;
  const maxGuard = count * 100;

  while (out.length < count && guard < maxGuard) {
    guard++;
    let item = null;
    if (nameLen === '1') item = genSameSingle();
    else item = MODE === 'same' ? genSame() : genCross();
    if (!item || seen.has(item.name)) continue;
    seen.add(item.name);
    out.push(item);
  }

  if (!out.length) {
    results.innerHTML = '<div class="empty">没有生成出合适的名字。<br>可能是范围限定太窄，或者语料太少。</div>';
    return;
  }

  results.innerHTML = out.map(item => {
    return `<div class="name-card" id="card-${item.rid}">${buildCardHTML(item.rid, item.name, item.sources, REFRESH_INFO[item.rid])}</div>`;
  }).join('');

  const active = getActiveDrawableKeys();
  const scopeInfo = SELECTED_WORKS ? `范围：${active.length} 类` : '范围：全部';
  info.textContent = `模式：${nameLen === '1' ? '单字名' : (MODE === 'same' ? '同句抽字' : '跨篇组合')} · ${scopeInfo} · 候选字：${CANDIDATE_CHARS.size} · 可用诗：${POEMS.length}`;
}

function initMeta() {
  const workCount = Object.keys(CORPUS).length;
  const poemCount = countAllPoems();
  document.getElementById('meta').textContent = `已加载 ${workCount} 部典籍 · ${poemCount} 篇原文`;
}

/* ============================================================
   启动
   ============================================================ */
async function boot() {
  initOpenCC();
  loadFavs();
  loadUserFilters();
  initMeta();
  updateBlacklistCount();

  if (countAllPoems() === 0) {
    document.getElementById('loadStatus').textContent = 'data.js 未加载或为空';
    return;
  }
  buildIndex(false);
}

boot();
</script>
